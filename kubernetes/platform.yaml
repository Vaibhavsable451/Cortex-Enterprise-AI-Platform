apiVersion: v1
kind: Namespace
metadata: { name: rag }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: rag-config, namespace: rag }
data:
  GROQ_MODEL: llama-3.3-70b-versatile
  PINECONE_INDEX: enterprise-rag
  PINECONE_CLOUD: aws
  PINECONE_REGION: us-east-1
  VECTOR_BACKEND: pinecone
  RATE_LIMIT_PER_MIN: "20"
---
apiVersion: v1
kind: Secret
metadata: { name: rag-secrets, namespace: rag }
type: Opaque
stringData:        # replace via `kubectl create secret` / sealed-secrets in real use
  GROQ_API_KEY: "REPLACE_ME"
  PINECONE_API_KEY: "REPLACE_ME"
  JWT_SECRET: "REPLACE_ME"
  ADMIN_PASSWORD: "REPLACE_ME"
  ANALYST_PASSWORD: "REPLACE_ME"
  DATABASE_URL: "mysql+pymysql://app:apppass@mysql:3306/audit"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: mysql-pvc, namespace: rag }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: mysql, namespace: rag }
spec:
  replicas: 1
  selector: { matchLabels: { app: mysql } }
  template:
    metadata: { labels: { app: mysql } }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          env:
            - { name: MYSQL_ROOT_PASSWORD, value: rootpass }
            - { name: MYSQL_DATABASE, value: audit }
            - { name: MYSQL_USER, value: app }
            - { name: MYSQL_PASSWORD, value: apppass }
          ports: [{ containerPort: 3306 }]
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
          readinessProbe: { exec: { command: [mysqladmin, ping, -h, localhost, -prootpass] }, initialDelaySeconds: 15, periodSeconds: 5 }
      volumes: [{ name: data, persistentVolumeClaim: { claimName: mysql-pvc } }]
---
apiVersion: v1
kind: Service
metadata: { name: mysql, namespace: rag }
spec: { selector: { app: mysql }, ports: [{ port: 3306 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend, namespace: rag }
spec:
  replicas: 2
  selector: { matchLabels: { app: backend } }
  template:
    metadata: { labels: { app: backend } }
    spec:
      containers:
        - name: backend
          image: ECR_REGISTRY/cortex-backend:latest
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: rag-config }
            - secretRef: { name: rag-secrets }
          resources: { requests: { cpu: 250m, memory: 1Gi }, limits: { cpu: "1", memory: 2Gi } }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 30, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 60, periodSeconds: 20 }
---
apiVersion: v1
kind: Service
metadata: { name: backend, namespace: rag }
spec: { selector: { app: backend }, ports: [{ port: 8000 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend, namespace: rag }
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: ECR_REGISTRY/cortex-frontend:latest
          ports: [{ containerPort: 8501 }]
          env: [{ name: API_URL, value: "http://backend:8000" }]
          readinessProbe: { httpGet: { path: /_stcore/health, port: 8501 }, initialDelaySeconds: 10 }
          livenessProbe: { httpGet: { path: /_stcore/health, port: 8501 }, initialDelaySeconds: 30 }
---
apiVersion: v1
kind: Service
metadata: { name: frontend, namespace: rag }
spec: { selector: { app: frontend }, ports: [{ port: 8501 }] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: backend-hpa, namespace: rag }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: backend }
  minReplicas: 2
  maxReplicas: 6
  metrics: [{ type: Resource, resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } } }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-ingress
  namespace: rag
  annotations: { nginx.ingress.kubernetes.io/proxy-body-size: 50m, nginx.ingress.kubernetes.io/proxy-read-timeout: "300" }
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: backend, port: { number: 8000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: frontend, port: { number: 8501 } } } }
